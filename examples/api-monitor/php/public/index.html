<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 性能监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333}
.layout{display:flex;height:100vh}
.sidebar{width:260px;background:#fff;color:#333;overflow-y:auto;flex-shrink:0;border-right:1px solid #e8e8e8}
.sidebar h2{padding:16px 20px;font-size:16px;border-bottom:1px solid #e8e8e8;background:#fafafa;color:#001529}
.sidebar .project{margin:4px 0}
.sidebar .project-name{padding:8px 20px;cursor:pointer;font-size:14px;color:#595959;transition:color .2s}
.sidebar .project-name:hover{color:#1890ff}
.sidebar .project-name.active{color:#1890ff;font-weight:600}
.sidebar .class-list{display:none;padding-left:16px}
.sidebar .class-list.open{display:block}
.sidebar .class-name{padding:5px 20px;cursor:pointer;font-size:13px;color:#8c8c8c;transition:color .2s}
.sidebar .class-name:hover{color:#1890ff}
.sidebar .class-name.active{color:#1890ff;font-weight:600}
.sidebar .method-list{display:none;padding-left:16px}
.sidebar .method-list.open{display:block}
.sidebar .method-item{padding:4px 20px;cursor:pointer;font-size:12px;color:#8c8c8c;transition:all .2s}
.sidebar .method-item:hover{color:#1890ff;background:#e6f7ff}
.sidebar .method-item.active{color:#1890ff;background:#e6f7ff;font-weight:600}
.main{flex:1;overflow-y:auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:22px;color:#001529;white-space:nowrap}
.search-box{display:flex;gap:8px;align-items:center}
.search-box input,.search-box select{padding:6px 12px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px}
.search-box input[type=text]{width:200px}
.search-box button{padding:6px 16px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px}
.search-box button:hover{background:#40a9ff}
.date-nav{display:flex;align-items:center;gap:4px}
.date-nav select{padding:6px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px;min-width:160px}
.date-btn{padding:6px 10px;background:#fff;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;font-size:12px;line-height:1}
.date-btn:hover{background:#e6f7ff;border-color:#1890ff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card .label{font-size:13px;color:#8c8c8c;margin-bottom:6px}
.card .value{font-size:28px;font-weight:700}
.card .value.green{color:#52c41a}
.card .value.red{color:#ff4d4f}
.card .value.blue{color:#1890ff}
.card .value.orange{color:#fa8c16}
.panel{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px}
.panel h3{font-size:16px;margin-bottom:12px;color:#001529;border-bottom:1px solid #f0f0f0;padding-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;color:#595959;border-bottom:1px solid #f0f0f0}
td{padding:10px 12px;border-bottom:1px solid #f5f5f5}
tr:hover td{background:#e6f7ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:#f6ffed;color:#52c41a}
.badge.warn{background:#fff7e6;color:#fa8c16}
.badge.err{background:#fff1f0;color:#ff4d4f}
.chart-wrap{position:relative;overflow:hidden}
.chart-viewport{overflow-x:auto;cursor:grab;-webkit-overflow-scrolling:touch}
.chart-viewport:active{cursor:grabbing}
.chart-viewport::-webkit-scrollbar{height:6px}
.chart-viewport::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:3px}
.chart-viewport::-webkit-scrollbar-thumb:hover{background:#bfbfbf}
.chart-inner{display:flex;align-items:end;height:90px;position:relative}
.chart-inner .bar{width:8px;min-width:8px;flex-shrink:0;background:#1890ff;position:relative;margin-right:2px}
.chart-inner .bar:hover{background:#40a9ff}
.chart-inner .bar .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:2px 6px;border-radius:3px;font-size:11px;white-space:nowrap;z-index:10}
.chart-inner .bar:hover .tip{display:block}
.chart-time-axis{display:flex;font-size:10px;color:#8c8c8c;margin-top:2px;position:relative}
.chart-time-axis .tick{position:absolute;top:0;transform:translateX(-50%)}
.chart-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-nav button{padding:4px 12px;background:#fff;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;font-size:12px}
.chart-nav button:hover{background:#e6f7ff;border-color:#1890ff}
.chart-nav .time-label{font-size:13px;color:#595959;min-width:120px;text-align:center}
.empty{text-align:center;padding:40px;color:#bfbfbf;font-size:14px}
.tab-bar{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid #f0f0f0}
.tab-bar .tab{padding:10px 24px;cursor:pointer;font-size:14px;color:#8c8c8c;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;user-select:none}
.tab-bar .tab.active{color:#1890ff;border-bottom-color:#1890ff;font-weight:600}
.tab-bar .tab:hover{color:#1890ff}
.pager{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.pager .page-info{font-size:12px;color:#8c8c8c;margin-right:8px}
.pager .page-btn{padding:4px 10px;background:#fff;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;font-size:12px}
.pager .page-btn:hover{border-color:#1890ff;color:#1890ff}
.pager .page-btn.active{background:#1890ff;color:#fff;border-color:#1890ff}
.api-link{color:#1890ff;text-decoration:none;cursor:pointer}
.api-link:hover{text-decoration:underline}
.stat-row:hover td{background:#e6f7ff}
.record-detail-row td{padding:0!important}
.pie-wrap{display:flex;align-items:flex-start;gap:16px}
.pie-wrap canvas{flex-shrink:0}
.pie-legend{font-size:12px;line-height:2;max-height:280px;overflow-y:auto;flex:1}
.pie-legend-item{display:flex;align-items:center;gap:6px;cursor:default}
.pie-legend-item .dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.pie-legend-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#595959}
.pie-legend-item .val{color:#8c8c8c;white-space:nowrap}
.home-btn{padding:6px 16px;background:#52c41a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;white-space:nowrap}
.home-btn:hover{background:#73d13d}
.logout-btn{padding:6px 12px;background:#fff;color:#ff4d4f;border:1px solid #ff4d4f;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap}
.logout-btn:hover{background:#fff1f0}
.pie-tooltip{position:absolute;background:rgba(0,0,0,.8);color:#fff;padding:6px 10px;border-radius:4px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:100;display:none}
.pie-wrap{position:relative}
.login-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:#fff;border-radius:12px;padding:40px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center;width:340px}
.login-box h2{margin-bottom:8px;color:#001529}
.login-box p{color:#8c8c8c;margin-bottom:20px;font-size:14px}
.login-box input{width:100%;padding:10px 14px;border:1px solid #d9d9d9;border-radius:6px;font-size:15px;margin-bottom:12px;text-align:center}
.login-box input:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.2)}
.login-box button{width:100%;padding:10px;background:#1890ff;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.login-box button:hover{background:#40a9ff}
.login-err{color:#ff4d4f;font-size:13px;margin-bottom:8px;min-height:20px}
</style>
</head>
<body>
<div class="login-mask" id="loginMask" style="display:none">
  <div class="login-box">
    <h2>🔒 API 监控</h2>
    <p>请输入访问密码</p>
    <input type="password" id="loginPwd" placeholder="密码" autofocus>
    <div class="login-err" id="loginErr"></div>
    <button onclick="doLogin()">登录</button>
  </div>
</div>
<div class="layout" id="mainLayout" style="display:none">
  <div class="sidebar" id="sidebar">
    <h2>📊 API 监控</h2>
    <div id="treeContainer"><div class="empty" style="color:#bfbfbf">加载中...</div></div>
  </div>
  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">仪表盘概览</h1>
      <div class="search-box">
        <button onclick="goHome()" class="home-btn" id="homeBtn">🏠 首页</button>
        <button onclick="doLogout()" class="logout-btn">退出</button>
        <input type="text" id="searchInput" placeholder="搜索接口...">
        <div class="date-nav">
          <button onclick="changeDate(-1)" class="date-btn" title="前一天">◀</button>
          <select id="dateSelect"></select>
          <button onclick="changeDate(1)" class="date-btn" title="后一天">▶</button>
        </div>
        <button onclick="doSearch()">搜索</button>
      </div>
    </div>
    <div id="content"><div class="empty">加载中...</div></div>
  </div>
</div>
<script>
const $one = s => document.querySelector(s);
const $all = s => document.querySelectorAll(s);
let currentDate = new Date().toISOString().slice(0,10);
let currentProject='', currentClass='', currentMethod='';
let dateList = [];

async function api(url) {
  const r = await fetch(url);
  const j = await r.json();
  return j.data;
}

// 初始化日期选择器
async function initDates() {
  dateList = await api('/api/dates');
  const sel = $one('#dateSelect');
  sel.innerHTML = '';
  dateList.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.date;
    const label = d.is_today ? d.date + ' (今天)' : d.date;
    const source = d.source === 'redis' ? ' [实时]' : (d.source === 'log' ? ' [日志]' : '');
    opt.textContent = label + source;
    if (!d.has_data) opt.style.color = '#bfbfbf';
    if (d.date === currentDate) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    currentDate = sel.value;
    onDateChange();
  });
}

function changeDate(offset) {
  const sel = $one('#dateSelect');
  const idx = sel.selectedIndex + offset;
  if (idx >= 0 && idx < sel.options.length) {
    sel.selectedIndex = idx;
    currentDate = sel.value;
    onDateChange();
  }
}

function onDateChange() {
  if (currentMethod) loadDetail(currentProject, currentClass, currentMethod);
  else loadDashboard();
}

function goHome() {
  currentProject=''; currentClass=''; currentMethod='';
  $all('.method-item').forEach(e => e.classList.remove('active'));
  $one('#pageTitle').textContent = '仪表盘概览';
  loadDashboard();
}

function doLogout() {
  document.cookie = 'monitor_token=; path=/; max-age=0';
  $one('#mainLayout').style.display = 'none';
  $one('#loginMask').style.display = 'flex';
  $one('#loginPwd').value = '';
  $one('#loginErr').textContent = '';
  $one('#loginPwd').focus();
}

// 加载树形菜单
async function loadTree() {
  const tree = await api('/api/tree?date=' + currentDate);
  let html = '';
  for (const [proj, classes] of Object.entries(tree)) {
    html += '<div class="project">' +
      '<div class="project-name" onclick="toggleProject(this,\'' + proj + '\')">' + proj + '</div>' +
      '<div class="class-list">';
    for (const [cls, methods] of Object.entries(classes)) {
      html += '<div class="class-name" onclick="toggleClass(this,\'' + proj + '\',\'' + cls + '\')">' + cls +
        '<div class="method-list">';
      for (const [mtd, uri] of Object.entries(methods)) {
        html += '<div class="method-item" onclick="event.stopPropagation();selectMethod(\'' + proj + '\',\'' + cls + '\',\'' + mtd + '\')" title="' + uri + '">' + mtd + '</div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  $one('#treeContainer').innerHTML = html || '<div class="empty" style="color:#bfbfbf">暂无数据</div>';
}

function toggleProject(el, proj) {
  const list = el.nextElementSibling;
  list.classList.toggle('open');
  el.classList.toggle('active');
}
function toggleClass(el, proj, cls) {
  event.stopPropagation();
  const list = el.querySelector('.method-list');
  list.classList.toggle('open');
  el.classList.toggle('active');
}
function selectMethod(proj, cls, mtd) {
  $all('.method-item').forEach(e => e.classList.remove('active'));
  event.target.classList.add('active');
  currentProject=proj; currentClass=cls; currentMethod=mtd;
  loadDetail(proj, cls, mtd);
}

// 仪表盘概览
async function loadDashboard() {
  currentProject=''; currentClass=''; currentMethod='';
  $all('.method-item').forEach(e => e.classList.remove('active'));
  $one('#pageTitle').textContent = '仪表盘概览';
  const d = await api('/api/dashboard?date=' + currentDate);
  const trend = await api('/api/trend?date=' + currentDate);
  const slow = await api('/api/ranking/slow?date=' + currentDate + '&limit=50');
  const top = await api('/api/ranking/count?date=' + currentDate + '&limit=50');

  let maxTr = Math.max(...trend.map(r=>r.count), 1);
  let barWidth = 10; // 8px bar + 2px gap
  let totalWidth = trend.length * barWidth;
  let trendBars = trend.map(r => {
    let h = r.count > 0 ? Math.max(r.count/maxTr*80, 1) : 0;
    return '<div class="bar" style="height:'+h+'px"><span class="tip">'+r.time.slice(11)+' : '+r.count+'次</span></div>';
  }).join('');

  // 时间刻度（每小时一个）
  let ticks = '';
  for (let h = 0; h < 24; h++) {
    let pos = h * 60 * barWidth;
    ticks += '<span class="tick" style="left:'+pos+'px">'+(h<10?'0'+h:h)+':00</span>';
  }

  let html = '<div class="cards">' +
    '<div class="card"><div class="label">今日总请求</div><div class="value blue">'+d.total_count+'</div></div>' +
    '<div class="card"><div class="label">成功次数</div><div class="value green">'+d.success+'</div></div>' +
    '<div class="card"><div class="label">失败次数</div><div class="value red">'+d.fail+'</div></div>' +
    '<div class="card"><div class="label">成功率</div><div class="value green">'+d.success_rate+'%</div></div>' +
    '<div class="card"><div class="label">平均耗时</div><div class="value orange">'+d.avg_time+'ms</div></div>' +
    '</div>' +
    '<div class="panel"><h3>📈 访问趋势（24小时 · 每分钟）</h3>' +
    '<div class="chart-nav">' +
    '<button onclick="scrollTrend(-60)">◀ 1h</button>' +
    '<button onclick="scrollTrend(-10)">◀ 10m</button>' +
    '<span class="time-label" id="trendTimeLabel"></span>' +
    '<button onclick="scrollTrend(10)">10m ▶</button>' +
    '<button onclick="scrollTrend(60)">1h ▶</button>' +
    '<button onclick="scrollTrendTo(\'now\')" style="margin-left:8px;background:#e6f7ff">当前</button>' +
    '</div>' +
    '<div class="chart-wrap"><div class="chart-viewport" id="trendViewport">' +
    '<div class="chart-inner" style="width:'+totalWidth+'px">'+trendBars+'</div>' +
    '<div class="chart-time-axis" style="width:'+totalWidth+'px;height:16px">'+ticks+'</div>' +
    '</div></div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
    '<div class="panel"><h3>🐢 慢速接口分布</h3><div class="pie-wrap"><canvas id="pieSlowCanvas" width="280" height="280"></canvas><div id="pieSlowLegend" class="pie-legend"></div></div></div>' +
    '<div class="panel"><h3>🔥 访问量分布</h3><div class="pie-wrap"><canvas id="pieCountCanvas" width="280" height="280"></canvas><div id="pieCountLegend" class="pie-legend"></div></div></div>' +
    '</div>' +
    '<div class="panel">' +
    '<div class="tab-bar"><div class="tab active" onclick="switchRankTab(\'slow\')">🐢 慢速 TOP50</div><div class="tab" onclick="switchRankTab(\'count\')">🔥 访问量 TOP50</div></div>' +
    '<div id="rankContent"></div>' +
    '</div>';
  $one('#content').innerHTML = html;
  initTrendScroll(trend);
  // 渲染饼图
  renderPieChart('pieSlowCanvas', 'pieSlowLegend', slow, 'avg_time', 'ms');
  renderPieChart('pieCountCanvas', 'pieCountLegend', top, 'count', '次');
  // 存储排行数据并渲染
  window._rankSlow = slow;
  window._rankCount = top;
  window._rankType = 'slow';
  window._rankPage = 1;
  renderRank();
}

// 趋势图滚动控制
let trendData = [];
function initTrendScroll(data) {
  trendData = data;
  const vp = $one('#trendViewport');
  if (!vp) return;
  // 滚动到当前时间附近
  scrollTrendTo('now');
  // 拖拽滚动
  let isDragging = false, startX = 0, scrollStart = 0;
  vp.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; scrollStart = vp.scrollLeft; vp.style.cursor = 'grabbing'; });
  document.addEventListener('mousemove', e => { if (!isDragging) return; vp.scrollLeft = scrollStart - (e.clientX - startX); });
  document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; vp.style.cursor = 'grab'; updateTrendLabel(); } });
  vp.addEventListener('scroll', () => updateTrendLabel());
  updateTrendLabel();
}

function scrollTrend(minutes) {
  const vp = $one('#trendViewport');
  if (!vp) return;
  vp.scrollLeft += minutes * 10;
  updateTrendLabel();
}

function scrollTrendTo(target) {
  const vp = $one('#trendViewport');
  if (!vp) return;
  if (target === 'now') {
    const now = new Date();
    const minuteOfDay = now.getHours() * 60 + now.getMinutes();
    const centerOffset = minuteOfDay * 10 - vp.clientWidth / 2;
    vp.scrollLeft = Math.max(0, centerOffset);
  }
  updateTrendLabel();
}

function updateTrendLabel() {
  const vp = $one('#trendViewport');
  const label = $one('#trendTimeLabel');
  if (!vp || !label) return;
  const barWidth = 10;
  const startMin = Math.floor(vp.scrollLeft / barWidth);
  const visibleBars = Math.floor(vp.clientWidth / barWidth);
  const endMin = Math.min(startMin + visibleBars, 1439);
  const startH = String(Math.floor(startMin / 60)).padStart(2, '0');
  const startM = String(startMin % 60).padStart(2, '0');
  const endH = String(Math.floor(endMin / 60)).padStart(2, '0');
  const endM = String(endMin % 60).padStart(2, '0');
  label.textContent = startH + ':' + startM + ' — ' + endH + ':' + endM;
}

// 饼图颜色
const PIE_COLORS = [
  '#1890ff','#52c41a','#fa8c16','#ff4d4f','#722ed1','#13c2c2','#eb2f96',
  '#faad14','#2f54eb','#a0d911','#f5222d','#1da57a','#9254de','#36cfc9',
  '#ff7a45','#597ef7','#ffc53d','#ff85c0','#73d13d','#40a9ff'
];

function renderPieChart(canvasId, legendId, data, valueField, unit) {
  const canvas = document.getElementById(canvasId);
  const legend = document.getElementById(legendId);
  if (!canvas || !legend) return;

  const ctx = canvas.getContext('2d');
  const cx = 140, cy = 140, r = 110, innerR = r * 0.55, hoverGrow = 8;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let items = data.slice(0, 20).map(d => ({
    name: d.class + '.' + d.method,
    value: d[valueField] || 0,
    project: d.project || '', cls: d.class || '', method: d.method || '',
    count: d.count || 0, avg_time: d.avg_time || 0, uri: d.uri || ''
  }));

  if (data.length > 20) {
    let otherVal = 0;
    for (let i = 20; i < data.length; i++) otherVal += data[i][valueField] || 0;
    items.push({ name: '其他 (' + (data.length - 20) + '个)', value: otherVal, project: '', cls: '', method: '', count: 0, avg_time: 0, uri: '' });
  }

  let total = items.reduce((s, d) => s + d.value, 0);
  if (total === 0) {
    ctx.fillStyle = '#f0f0f0';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#bfbfbf'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('暂无数据', cx, cy + 5);
    return;
  }

  // 计算扇区角度
  let slices = [];
  let startAngle = -Math.PI / 2;
  items.forEach((item, i) => {
    let sliceAngle = (item.value / total) * Math.PI * 2;
    slices.push({ start: startAngle, end: startAngle + sliceAngle, item: item, color: PIE_COLORS[i % PIE_COLORS.length] });
    startAngle += sliceAngle;
  });

  // 绘制函数（支持高亮某个扇区）
  function drawPie(hoverIdx) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    slices.forEach((s, i) => {
      let curR = (i === hoverIdx) ? r + hoverGrow : r;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, curR, s.start, s.end);
      ctx.closePath();
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    // 中心白圆
    ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    // 中心文字
    let displayTotal = unit === 'ms' ? parseFloat(total).toFixed(2) + 'ms' : total;
    ctx.fillStyle = '#333'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(displayTotal, cx, cy - 2);
    ctx.fillStyle = '#8c8c8c'; ctx.font = '12px sans-serif';
    ctx.fillText(unit === 'ms' ? '总平均耗时' : '总访问量', cx, cy + 16);
  }

  drawPie(-1);

  // 获取或创建 tooltip
  let wrap = canvas.parentElement;
  let tip = wrap.querySelector('.pie-tooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'pie-tooltip';
    wrap.appendChild(tip);
  }

  // 检测鼠标在哪个扇区
  function hitTest(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left - cx;
    const y = e.clientY - rect.top - cy;
    const dist = Math.sqrt(x * x + y * y);
    if (dist < innerR || dist > r + hoverGrow) return -1;
    let angle = Math.atan2(y, x);
    for (let i = 0; i < slices.length; i++) {
      let a = angle;
      while (a < slices[i].start) a += Math.PI * 2;
      if (a >= slices[i].start && a < slices[i].end) return i;
    }
    return -1;
  }

  let lastHover = -1;
  canvas.onmousemove = function(e) {
    let idx = hitTest(e);
    if (idx !== lastHover) {
      lastHover = idx;
      drawPie(idx);
      canvas.style.cursor = (idx >= 0 && slices[idx].item.project) ? 'pointer' : (idx >= 0 ? 'default' : 'default');
    }
    if (idx >= 0) {
      let s = slices[idx].item;
      let pct = (s.value / total * 100).toFixed(1);
      let valStr = unit === 'ms' ? s.value.toFixed(2) + 'ms' : s.value + '次';
      tip.innerHTML = '<div style="font-weight:600;margin-bottom:2px">' + s.name + '</div>' +
        valStr + ' (' + pct + '%)' +
        (s.uri ? '<br>URI: ' + s.uri : '') +
        (s.count && unit === 'ms' ? '<br>次数: ' + s.count : '') +
        (s.avg_time && unit !== 'ms' ? '<br>平均耗时: ' + s.avg_time.toFixed(2) + 'ms' : '');
      const rect = canvas.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = (e.clientX - wrapRect.left + 12) + 'px';
      tip.style.top = (e.clientY - wrapRect.top - 10) + 'px';
    } else {
      tip.style.display = 'none';
    }
  };

  canvas.onmouseleave = function() {
    lastHover = -1;
    drawPie(-1);
    tip.style.display = 'none';
  };

  canvas.onclick = function(e) {
    let idx = hitTest(e);
    if (idx >= 0 && slices[idx].item.project) {
      let s = slices[idx].item;
      selectMethod(s.project, s.cls, s.method);
    }
  };

  // 图例
  let legendHtml = items.map((item, i) => {
    let pct = (item.value / total * 100).toFixed(1);
    let color = PIE_COLORS[i % PIE_COLORS.length];
    let clickAttr = item.project ? ' onclick="selectMethod(\''+item.project+'\',\''+item.cls+'\',\''+item.method+'\')" style="cursor:pointer"' : '';
    return '<div class="pie-legend-item" title="' + item.name + ': ' + (unit==='ms'?item.value.toFixed(2):item.value) + unit + ' (' + pct + '%)"' + clickAttr + '>' +
      '<span class="dot" style="background:' + color + '"></span>' +
      '<span class="name">' + item.name + '</span>' +
      '<span class="val">' + pct + '%</span></div>';
  }).join('');
  legend.innerHTML = legendHtml;
}

function switchRankTab(type) {
  window._rankType = type;
  window._rankPage = 1;
  $all('.tab-bar .tab').forEach(t => t.classList.remove('active'));
  const tabs = $all('.tab-bar .tab');
  if (type === 'slow') tabs[0].classList.add('active');
  else tabs[1].classList.add('active');
  renderRank();
}

function renderRank() {
  const type = window._rankType || 'slow';
  const list = type === 'slow' ? (window._rankSlow || []) : (window._rankCount || []);

  let content = $one('#rankContent');
  if (!content) return;

  if (!list.length) {
    content.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }

  let rows = list.map((r, i) => {
    let badge, val, extra;
    if (type === 'slow') {
      badge = r.avg_time>1000?'err':r.avg_time>500?'warn':'ok';
      val = r.avg_time+'ms';
      extra = '<td>'+r.max_time+'ms</td><td>'+r.count+'</td>';
    } else {
      badge = r.success_rate<90?'err':r.success_rate<99?'warn':'ok';
      val = r.count;
      extra = '<td>'+r.success+'</td><td>'+r.fail+'</td><td><span class="badge '+badge+'">'+r.success_rate+'%</span></td>';
    }
    return '<tr><td>'+(i+1)+'</td><td title="'+r.uri+'"><a href="#" class="api-link" onclick="event.preventDefault();selectMethod(\''+r.project+'\',\''+r.class+'\',\''+r.method+'\')">'+r.class+'.'+r.method+'</a></td><td><span class="badge '+badge+'">'+val+'</span></td>'+extra+'</tr>';
  }).join('');

  let th = type === 'slow'
    ? '<th>#</th><th>接口</th><th>平均耗时</th><th>最大耗时</th><th>次数</th>'
    : '<th>#</th><th>接口</th><th>次数</th><th>成功</th><th>失败</th><th>成功率</th>';

  content.innerHTML = '<table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table>';
}

// 接口详情
async function loadDetail(proj, cls, mtd) {
  $one('#pageTitle').textContent = proj + ' / ' + cls + ' / ' + mtd;
  const data = await api('/api/detail?project='+proj+'&class='+cls+'&method='+mtd+'&date='+currentDate+'&granularity=minute');
  if (!data.length) { $one('#content').innerHTML='<div class="empty">暂无数据</div>'; return; }
  const info = data[0];
  const periods = info.periods;
  const keys = Object.keys(periods);

  let totalCount=0, totalSuccess=0, totalFail=0, totalTime=0, maxTime=0;
  keys.forEach(k => {
    const s=periods[k];
    totalCount+=s.count; totalSuccess+=s.success; totalFail+=s.fail;
    totalTime+=s.total_time; if(s.max_time>maxTime) maxTime=s.max_time;
  });
  let avgTime = totalCount>0 ? (totalTime/totalCount).toFixed(2) : 0;
  let successRate = totalCount>0 ? (totalSuccess/totalCount*100).toFixed(2) : 0;

  // 构建全天 1440 个点的数据
  let allMinutes = [];
  let maxC = 1;
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m++) {
      let minute = currentDate + ' ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
      let s = periods[minute] || null;
      let count = s ? s.count : 0;
      let avgT = s ? s.avg_time : 0;
      if (count > maxC) maxC = count;
      allMinutes.push({time: minute, count: count, avg_time: avgT});
    }
  }

  let barWidth = 10;
  let totalWidth = 1440 * barWidth;
  let detailBars = allMinutes.map(r => {
    let h = r.count > 0 ? Math.max(r.count/maxC*80, 1) : 0;
    return '<div class="bar" style="height:'+h+'px"><span class="tip">'+r.time.slice(11)+' '+r.count+'次 '+r.avg_time+'ms</span></div>';
  }).join('');

  let ticks = '';
  for (let h = 0; h < 24; h++) {
    let pos = h * 60 * barWidth;
    ticks += '<span class="tick" style="left:'+pos+'px">'+(h<10?'0'+h:h)+':00</span>';
  }

  let rows = keys.map(k => {
    let s=periods[k];
    let badge = s.success_rate<90?'err':s.success_rate<99?'warn':'ok';
    return '<tr class="stat-row" onclick="toggleRecords(this,\''+proj+'\',\''+cls+'\',\''+mtd+'\',\''+k+'\')" style="cursor:pointer">' +
      '<td>'+k+' <span style="font-size:11px;color:#1890ff">▶</span></td><td>'+s.count+'</td><td>'+s.success+'</td><td>'+s.fail+'</td>' +
      '<td><span class="badge '+badge+'">'+s.success_rate+'%</span></td>' +
      '<td>'+s.avg_time+'ms</td><td>'+s.max_time.toFixed(2)+'ms</td><td>'+s.min_time.toFixed(2)+'ms</td></tr>';
  }).join('');

  let html = '<div class="cards">' +
    '<div class="card"><div class="label">总请求</div><div class="value blue">'+totalCount+'</div></div>' +
    '<div class="card"><div class="label">成功</div><div class="value green">'+totalSuccess+'</div></div>' +
    '<div class="card"><div class="label">失败</div><div class="value red">'+totalFail+'</div></div>' +
    '<div class="card"><div class="label">成功率</div><div class="value green">'+successRate+'%</div></div>' +
    '<div class="card"><div class="label">平均耗时</div><div class="value orange">'+avgTime+'ms</div></div>' +
    '<div class="card"><div class="label">最大耗时</div><div class="value red">'+maxTime.toFixed(2)+'ms</div></div>' +
    '</div>' +
    '<div class="panel"><h3>📈 访问趋势（24小时 · 每分钟）</h3>' +
    '<div class="chart-nav">' +
    '<button onclick="scrollTrend(-60)">◀ 1h</button>' +
    '<button onclick="scrollTrend(-10)">◀ 10m</button>' +
    '<span class="time-label" id="trendTimeLabel"></span>' +
    '<button onclick="scrollTrend(10)">10m ▶</button>' +
    '<button onclick="scrollTrend(60)">1h ▶</button>' +
    '<button onclick="scrollTrendTo(\'now\')" style="margin-left:8px;background:#e6f7ff">当前</button>' +
    '</div>' +
    '<div class="chart-wrap"><div class="chart-viewport" id="trendViewport">' +
    '<div class="chart-inner" style="width:'+totalWidth+'px">'+detailBars+'</div>' +
    '<div class="chart-time-axis" style="width:'+totalWidth+'px;height:16px">'+ticks+'</div>' +
    '</div></div></div>' +
    '<div class="panel"><h3>📋 分时统计 <span style="font-size:12px;color:#8c8c8c;font-weight:normal">（点击行查看明细）</span></h3>' +
    '<table id="statTable"><thead><tr><th>时间</th><th>次数</th><th>成功</th><th>失败</th><th>成功率</th><th>平均耗时</th><th>最大</th><th>最小</th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table></div>';
  $one('#content').innerHTML = html;
  initTrendScroll(allMinutes);
}

// 展开/收起分时明细
async function toggleRecords(tr, proj, cls, mtd, minute) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('record-detail-row')) {
    next.remove();
    tr.querySelector('span').textContent = '▶';
    return;
  }
  // 关闭其他已展开的
  $all('.record-detail-row').forEach(r => r.remove());
  $all('.stat-row span').forEach(s => { if(s.textContent==='▼') s.textContent='▶'; });

  tr.querySelector('span').textContent = '▼';
  const records = await api('/api/records?project='+encodeURIComponent(proj)+'&class='+encodeURIComponent(cls)+'&method='+encodeURIComponent(mtd)+'&minute='+encodeURIComponent(minute));

  let detailHtml;
  if (!records.length) {
    detailHtml = '<td colspan="8"><div class="empty" style="padding:12px">该时段无明细记录（明细仅保留最近 2 小时）</div></td>';
  } else {
    let rRows = records.map(r => {
      let stBadge = r.status < 400 ? 'ok' : (r.status < 500 ? 'warn' : 'err');
      let paramStr = r.params && Object.keys(r.params).length > 0 ? JSON.stringify(r.params) : '-';
      let respStr = r.response && Object.keys(r.response).length > 0 ? JSON.stringify(r.response) : '-';
      return '<tr style="background:#fafafa"><td>'+r.time+'</td><td>'+r.duration+'ms</td>' +
        '<td><span class="badge '+stBadge+'">'+r.status+'</span></td>' +
        '<td style="font-size:12px;color:#595959;word-break:break-all">'+paramStr+'</td>' +
        '<td style="font-size:12px;color:#595959;word-break:break-all">'+respStr+'</td></tr>';
    }).join('');
    detailHtml = '<td colspan="8" style="padding:0"><table style="margin:0;background:#fafafa">' +
      '<thead><tr style="background:#f0f0f0"><th>时间</th><th>耗时</th><th>状态</th><th>传入参数</th><th>返回参数</th></tr></thead>' +
      '<tbody>'+rRows+'</tbody></table></td>';
  }
  const detailRow = document.createElement('tr');
  detailRow.className = 'record-detail-row';
  detailRow.innerHTML = detailHtml;
  tr.after(detailRow);
}

// 搜索
async function doSearch() {
  const kw = $one('#searchInput').value.trim();
  currentDate = $one('#dateSelect').value || currentDate;
  if (!kw) { loadDashboard(); return; }
  $one('#pageTitle').textContent = '搜索: ' + kw;
  const list = await api('/api/search?keyword='+encodeURIComponent(kw)+'&date='+currentDate);
  if (!list.length) { $one('#content').innerHTML='<div class="empty">未找到匹配接口</div>'; return; }
  let rows = list.map(r => {
    let badge = r.success_rate<90?'err':r.success_rate<99?'warn':'ok';
    return '<tr><td>'+r.project+'</td><td>'+r.class+'</td>' +
      '<td><a href="#" onclick="event.preventDefault();selectMethod(\''+r.project+'\',\''+r.class+'\',\''+r.method+'\')">'+r.method+'</a></td>' +
      '<td>'+r.uri+'</td><td>'+r.count+'</td><td><span class="badge '+badge+'">'+r.success_rate+'%</span></td><td>'+r.avg_time+'ms</td></tr>';
  }).join('');
  $one('#content').innerHTML = '<div class="panel"><h3>搜索结果</h3>' +
    '<table><thead><tr><th>项目</th><th>类</th><th>方法</th><th>URI</th><th>次数</th><th>成功率</th><th>平均耗时</th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table></div>';
}

// 登录逻辑
async function checkAuth() {
  try {
    const r = await api('/api/check-login');
    if (r.need_login) {
      $one('#loginMask').style.display = 'flex';
      $one('#mainLayout').style.display = 'none';
      $one('#loginPwd').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
    } else {
      showMain();
    }
  } catch(e) {
    showMain();
  }
}

async function doLogin() {
  const pwd = $one('#loginPwd').value;
  if (!pwd) { $one('#loginErr').textContent = '请输入密码'; return; }
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'password=' + encodeURIComponent(pwd)
    });
    const j = await r.json();
    if (j.code === 0 && j.data.ok) {
      showMain();
    } else {
      $one('#loginErr').textContent = j.data?.msg || '密码错误';
      $one('#loginPwd').value = '';
      $one('#loginPwd').focus();
    }
  } catch(e) {
    $one('#loginErr').textContent = '登录失败，请重试';
  }
}

function showMain() {
  $one('#loginMask').style.display = 'none';
  $one('#mainLayout').style.display = 'flex';
  initDates().then(() => {
    loadTree();
    loadDashboard();
  });
}

$one('#searchInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

// 静默更新（不重绘页面，只更新数据）
setInterval(async () => {
  try {
    if (currentMethod) return; // 在详情页不自动更新
    const d = await api('/api/dashboard?date=' + currentDate);
    const trend = await api('/api/trend?date=' + currentDate);
    const slow = await api('/api/ranking/slow?date=' + currentDate + '&limit=50');
    const top = await api('/api/ranking/count?date=' + currentDate + '&limit=50');

    // 更新卡片数值
    const cards = $all('.card .value');
    if (cards.length >= 5) {
      cards[0].textContent = d.total_count;
      cards[1].textContent = d.success;
      cards[2].textContent = d.fail;
      cards[3].textContent = d.success_rate + '%';
      cards[4].textContent = d.avg_time + 'ms';
    }

    // 更新排行数据（不重绘表格，下次切换 tab 时生效）
    window._rankSlow = slow;
    window._rankCount = top;
    renderRank();

    // 更新饼图
    renderPieChart('pieSlowCanvas', 'pieSlowLegend', slow, 'avg_time', 'ms');
    renderPieChart('pieCountCanvas', 'pieCountLegend', top, 'count', '次');

    // 静默更新树形菜单
    loadTree();
  } catch(e) {}
}, 10000);

// 初始加载
checkAuth();
</script>
