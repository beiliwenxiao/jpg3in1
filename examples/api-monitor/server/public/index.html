<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 性能监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333}
.layout{display:flex;height:100vh}
.sidebar{width:260px;background:#fff;color:#333;overflow-y:auto;flex-shrink:0;border-right:1px solid #e8e8e8}
.sidebar h2{padding:16px 20px;font-size:16px;border-bottom:1px solid #e8e8e8;background:#fafafa;color:#001529}
.sidebar .project{margin:4px 0}
.sidebar .project-name{padding:8px 20px;cursor:pointer;font-size:14px;color:#595959;transition:color .2s}
.sidebar .project-name:hover{color:#1890ff}
.sidebar .project-name.active{color:#1890ff;font-weight:600}
.sidebar .class-list{display:none;padding-left:16px}
.sidebar .class-list.open{display:block}
.sidebar .class-name{padding:5px 20px;cursor:pointer;font-size:13px;color:#8c8c8c;transition:color .2s}
.sidebar .class-name:hover{color:#1890ff}
.sidebar .class-name.active{color:#1890ff;font-weight:600}
.sidebar .method-list{display:none;padding-left:16px}
.sidebar .method-list.open{display:block}
.sidebar .method-item{padding:4px 20px;cursor:pointer;font-size:12px;color:#8c8c8c;transition:all .2s}
.sidebar .method-item:hover{color:#1890ff;background:#e6f7ff}
.sidebar .method-item.active{color:#1890ff;background:#e6f7ff;font-weight:600}
.main{flex:1;overflow-y:auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:22px;color:#001529;white-space:nowrap}
.search-box{display:flex;gap:8px;align-items:center}
.search-box input,.search-box select{padding:6px 12px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px}
.search-box input[type=text]{width:200px}
.search-box button{padding:6px 16px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px}
.search-box button:hover{background:#40a9ff}
.date-nav{display:flex;align-items:center;gap:4px}
.date-nav select{padding:6px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px;min-width:160px}
.date-btn{padding:6px 10px;background:#fff;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;font-size:12px;line-height:1}
.date-btn:hover{background:#e6f7ff;border-color:#1890ff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card .label{font-size:13px;color:#8c8c8c;margin-bottom:6px}
.card .value{font-size:28px;font-weight:700}
.card .value.green{color:#52c41a}
.card .value.red{color:#ff4d4f}
.card .value.blue{color:#1890ff}
.card .value.orange{color:#fa8c16}
.panel{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px}
.panel h3{font-size:16px;margin-bottom:12px;color:#001529;border-bottom:1px solid #f0f0f0;padding-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;color:#595959;border-bottom:1px solid #f0f0f0}
td{padding:10px 12px;border-bottom:1px solid #f5f5f5}
tr:hover td{background:#e6f7ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.ok{background:#f6ffed;color:#52c41a}
.badge.warn{background:#fff7e6;color:#fa8c16}
.badge.err{background:#fff1f0;color:#ff4d4f}
.chart-wrap{position:relative;overflow:hidden}
.chart-viewport{overflow-x:auto;cursor:grab;-webkit-overflow-scrolling:touch}
.chart-viewport:active{cursor:grabbing}
.chart-viewport::-webkit-scrollbar{height:6px}
.chart-viewport::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:3px}
.chart-viewport::-webkit-scrollbar-thumb:hover{background:#bfbfbf}
.chart-inner{display:flex;align-items:end;height:90px;position:relative}
.chart-inner .bar{width:8px;min-width:8px;flex-shrink:0;background:#1890ff;position:relative;margin-right:2px}
.chart-inner .bar:hover{background:#40a9ff}
.chart-inner .bar .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:2px 6px;border-radius:3px;font-size:11px;white-space:nowrap;z-index:10}
.chart-inner .bar:hover .tip{display:block}
.chart-time-axis{display:flex;font-size:10px;color:#8c8c8c;margin-top:2px;position:relative}
.chart-time-axis .tick{position:absolute;top:0;transform:translateX(-50%)}
.chart-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-nav button{padding:4px 12px;background:#fff;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;font-size:12px}
.chart-nav button:hover{background:#e6f7ff;border-color:#1890ff}
.chart-nav .time-label{font-size:13px;color:#595959;min-width:120px;text-align:center}
.empty{text-align:center;padding:40px;color:#bfbfbf;font-size:14px}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <h2>📊 API 监控</h2>
    <div id="treeContainer"><div class="empty" style="color:#bfbfbf">加载中...</div></div>
  </div>
  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">仪表盘概览</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索接口...">
        <div class="date-nav">
          <button onclick="changeDate(-1)" class="date-btn" title="前一天">◀</button>
          <select id="dateSelect"></select>
          <button onclick="changeDate(1)" class="date-btn" title="后一天">▶</button>
        </div>
        <button onclick="doSearch()">搜索</button>
        <button onclick="loadDashboard()" style="background:#52c41a">概览</button>
      </div>
    </div>
    <div id="content"><div class="empty">加载中...</div></div>
  </div>
</div>
<script>
const $one = s => document.querySelector(s);
const $all = s => document.querySelectorAll(s);
let currentDate = new Date().toISOString().slice(0,10);
let currentProject='', currentClass='', currentMethod='';
let dateList = [];

async function api(url) {
  const r = await fetch(url);
  const j = await r.json();
  return j.data;
}

// 初始化日期选择器
async function initDates() {
  dateList = await api('/api/dates');
  const sel = $one('#dateSelect');
  sel.innerHTML = '';
  dateList.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.date;
    const label = d.is_today ? d.date + ' (今天)' : d.date;
    const source = d.source === 'redis' ? ' [实时]' : (d.source === 'log' ? ' [日志]' : '');
    opt.textContent = label + source;
    if (!d.has_data) opt.style.color = '#bfbfbf';
    if (d.date === currentDate) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    currentDate = sel.value;
    onDateChange();
  });
}

function changeDate(offset) {
  const sel = $one('#dateSelect');
  const idx = sel.selectedIndex + offset;
  if (idx >= 0 && idx < sel.options.length) {
    sel.selectedIndex = idx;
    currentDate = sel.value;
    onDateChange();
  }
}

function onDateChange() {
  if (currentMethod) loadDetail(currentProject, currentClass, currentMethod);
  else loadDashboard();
}

// 加载树形菜单
async function loadTree() {
  const tree = await api('/api/tree?date=' + currentDate);
  let html = '';
  for (const [proj, classes] of Object.entries(tree)) {
    html += '<div class="project">' +
      '<div class="project-name" onclick="toggleProject(this,\'' + proj + '\')">' + proj + '</div>' +
      '<div class="class-list">';
    for (const [cls, methods] of Object.entries(classes)) {
      html += '<div class="class-name" onclick="toggleClass(this,\'' + proj + '\',\'' + cls + '\')">' + cls +
        '<div class="method-list">';
      for (const [mtd, uri] of Object.entries(methods)) {
        html += '<div class="method-item" onclick="event.stopPropagation();selectMethod(\'' + proj + '\',\'' + cls + '\',\'' + mtd + '\')" title="' + uri + '">' + mtd + '</div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  $one('#treeContainer').innerHTML = html || '<div class="empty" style="color:#bfbfbf">暂无数据</div>';
}

function toggleProject(el, proj) {
  const list = el.nextElementSibling;
  list.classList.toggle('open');
  el.classList.toggle('active');
}
function toggleClass(el, proj, cls) {
  event.stopPropagation();
  const list = el.querySelector('.method-list');
  list.classList.toggle('open');
  el.classList.toggle('active');
}
function selectMethod(proj, cls, mtd) {
  $all('.method-item').forEach(e => e.classList.remove('active'));
  event.target.classList.add('active');
  currentProject=proj; currentClass=cls; currentMethod=mtd;
  loadDetail(proj, cls, mtd);
}

// 仪表盘概览
async function loadDashboard() {
  currentProject=''; currentClass=''; currentMethod='';
  $all('.method-item').forEach(e => e.classList.remove('active'));
  $one('#pageTitle').textContent = '仪表盘概览';
  const d = await api('/api/dashboard?date=' + currentDate);
  const trend = await api('/api/trend?date=' + currentDate);
  const slow = await api('/api/ranking/slow?date=' + currentDate + '&limit=10');
  const top = await api('/api/ranking/count?date=' + currentDate + '&limit=10');

  let maxTr = Math.max(...trend.map(r=>r.count), 1);
  let barWidth = 10; // 8px bar + 2px gap
  let totalWidth = trend.length * barWidth;
  let trendBars = trend.map(r => {
    let h = r.count > 0 ? Math.max(r.count/maxTr*80, 1) : 0;
    return '<div class="bar" style="height:'+h+'px"><span class="tip">'+r.time.slice(11)+' : '+r.count+'次</span></div>';
  }).join('');

  // 时间刻度（每小时一个）
  let ticks = '';
  for (let h = 0; h < 24; h++) {
    let pos = h * 60 * barWidth;
    ticks += '<span class="tick" style="left:'+pos+'px">'+(h<10?'0'+h:h)+':00</span>';
  }

  let html = '<div class="cards">' +
    '<div class="card"><div class="label">今日总请求</div><div class="value blue">'+d.total_count+'</div></div>' +
    '<div class="card"><div class="label">成功次数</div><div class="value green">'+d.success+'</div></div>' +
    '<div class="card"><div class="label">失败次数</div><div class="value red">'+d.fail+'</div></div>' +
    '<div class="card"><div class="label">成功率</div><div class="value green">'+d.success_rate+'%</div></div>' +
    '<div class="card"><div class="label">平均耗时</div><div class="value orange">'+d.avg_time+'ms</div></div>' +
    '</div>' +
    '<div class="panel"><h3>📈 访问趋势（24小时 · 每分钟）</h3>' +
    '<div class="chart-nav">' +
    '<button onclick="scrollTrend(-60)">◀ 1h</button>' +
    '<button onclick="scrollTrend(-10)">◀ 10m</button>' +
    '<span class="time-label" id="trendTimeLabel"></span>' +
    '<button onclick="scrollTrend(10)">10m ▶</button>' +
    '<button onclick="scrollTrend(60)">1h ▶</button>' +
    '<button onclick="scrollTrendTo(\'now\')" style="margin-left:8px;background:#e6f7ff">当前</button>' +
    '</div>' +
    '<div class="chart-wrap"><div class="chart-viewport" id="trendViewport">' +
    '<div class="chart-inner" style="width:'+totalWidth+'px">'+trendBars+'</div>' +
    '<div class="chart-time-axis" style="width:'+totalWidth+'px;height:16px">'+ticks+'</div>' +
    '</div></div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
    '<div class="panel"><h3>🐢 慢速接口 TOP10</h3>'+rankTable(slow,'slow')+'</div>' +
    '<div class="panel"><h3>🔥 访问量 TOP10</h3>'+rankTable(top,'count')+'</div>' +
    '</div>';
  $one('#content').innerHTML = html;
  initTrendScroll(trend);
}

// 趋势图滚动控制
let trendData = [];
function initTrendScroll(data) {
  trendData = data;
  const vp = $one('#trendViewport');
  if (!vp) return;
  // 滚动到当前时间附近
  scrollTrendTo('now');
  // 拖拽滚动
  let isDragging = false, startX = 0, scrollStart = 0;
  vp.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; scrollStart = vp.scrollLeft; vp.style.cursor = 'grabbing'; });
  document.addEventListener('mousemove', e => { if (!isDragging) return; vp.scrollLeft = scrollStart - (e.clientX - startX); });
  document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; vp.style.cursor = 'grab'; updateTrendLabel(); } });
  vp.addEventListener('scroll', () => updateTrendLabel());
  updateTrendLabel();
}

function scrollTrend(minutes) {
  const vp = $one('#trendViewport');
  if (!vp) return;
  vp.scrollLeft += minutes * 10;
  updateTrendLabel();
}

function scrollTrendTo(target) {
  const vp = $one('#trendViewport');
  if (!vp) return;
  if (target === 'now') {
    const now = new Date();
    const minuteOfDay = now.getHours() * 60 + now.getMinutes();
    const centerOffset = minuteOfDay * 10 - vp.clientWidth / 2;
    vp.scrollLeft = Math.max(0, centerOffset);
  }
  updateTrendLabel();
}

function updateTrendLabel() {
  const vp = $one('#trendViewport');
  const label = $one('#trendTimeLabel');
  if (!vp || !label) return;
  const barWidth = 10;
  const startMin = Math.floor(vp.scrollLeft / barWidth);
  const visibleBars = Math.floor(vp.clientWidth / barWidth);
  const endMin = Math.min(startMin + visibleBars, 1439);
  const startH = String(Math.floor(startMin / 60)).padStart(2, '0');
  const startM = String(startMin % 60).padStart(2, '0');
  const endH = String(Math.floor(endMin / 60)).padStart(2, '0');
  const endM = String(endMin % 60).padStart(2, '0');
  label.textContent = startH + ':' + startM + ' — ' + endH + ':' + endM;
}

function rankTable(list, type) {
  if (!list.length) return '<div class="empty">暂无数据</div>';
  let rows = list.map((r,i) => {
    let badge = type==='slow'
      ? (r.avg_time>1000?'err':r.avg_time>500?'warn':'ok')
      : (r.success_rate<90?'err':r.success_rate<99?'warn':'ok');
    let val = type==='slow' ? r.avg_time+'ms' : r.count;
    let extra = type==='slow' ? '<td>'+r.max_time+'ms</td><td>'+r.count+'</td>'
      : '<td>'+r.success+'</td><td>'+r.fail+'</td><td><span class="badge '+badge+'">'+r.success_rate+'%</span></td>';
    return '<tr><td>'+(i+1)+'</td><td title="'+r.uri+'">'+r.class+'.'+r.method+'</td><td><span class="badge '+badge+'">'+val+'</span></td>'+extra+'</tr>';
  }).join('');
  let th = type==='slow'
    ? '<th>#</th><th>接口</th><th>平均耗时</th><th>最大耗时</th><th>次数</th>'
    : '<th>#</th><th>接口</th><th>次数</th><th>成功</th><th>失败</th><th>成功率</th>';
  return '<table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table>';
}

// 接口详情
async function loadDetail(proj, cls, mtd) {
  $one('#pageTitle').textContent = proj + ' / ' + cls + ' / ' + mtd;
  const data = await api('/api/detail?project='+proj+'&class='+cls+'&method='+mtd+'&date='+currentDate+'&granularity=minute');
  if (!data.length) { $one('#content').innerHTML='<div class="empty">暂无数据</div>'; return; }
  const info = data[0];
  const periods = info.periods;
  const keys = Object.keys(periods);

  let totalCount=0, totalSuccess=0, totalFail=0, totalTime=0, maxTime=0;
  keys.forEach(k => {
    const s=periods[k];
    totalCount+=s.count; totalSuccess+=s.success; totalFail+=s.fail;
    totalTime+=s.total_time; if(s.max_time>maxTime) maxTime=s.max_time;
  });
  let avgTime = totalCount>0 ? (totalTime/totalCount).toFixed(2) : 0;
  let successRate = totalCount>0 ? (totalSuccess/totalCount*100).toFixed(2) : 0;

  let maxC = Math.max(...keys.map(k=>periods[k].count),1);
  let bars = keys.map(k => {
    let s=periods[k], h=Math.max(s.count/maxC*70,2);
    return '<div class="bar" style="height:'+h+'px"><span class="tip">'+k.slice(11)+' '+s.count+'次 '+s.avg_time+'ms</span></div>';
  }).join('');

  let rows = keys.map(k => {
    let s=periods[k];
    let badge = s.success_rate<90?'err':s.success_rate<99?'warn':'ok';
    return '<tr><td>'+k+'</td><td>'+s.count+'</td><td>'+s.success+'</td><td>'+s.fail+'</td>' +
      '<td><span class="badge '+badge+'">'+s.success_rate+'%</span></td>' +
      '<td>'+s.avg_time+'ms</td><td>'+s.max_time.toFixed(2)+'ms</td><td>'+s.min_time.toFixed(2)+'ms</td></tr>';
  }).join('');

  let html = '<div class="cards">' +
    '<div class="card"><div class="label">总请求</div><div class="value blue">'+totalCount+'</div></div>' +
    '<div class="card"><div class="label">成功</div><div class="value green">'+totalSuccess+'</div></div>' +
    '<div class="card"><div class="label">失败</div><div class="value red">'+totalFail+'</div></div>' +
    '<div class="card"><div class="label">成功率</div><div class="value green">'+successRate+'%</div></div>' +
    '<div class="card"><div class="label">平均耗时</div><div class="value orange">'+avgTime+'ms</div></div>' +
    '<div class="card"><div class="label">最大耗时</div><div class="value red">'+maxTime.toFixed(2)+'ms</div></div>' +
    '</div>' +
    '<div class="panel"><h3>📈 访问趋势</h3><div class="chart-bar">'+bars+'</div></div>' +
    '<div class="panel"><h3>📋 分时统计</h3>' +
    '<table><thead><tr><th>时间</th><th>次数</th><th>成功</th><th>失败</th><th>成功率</th><th>平均耗时</th><th>最大</th><th>最小</th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table></div>';
  $one('#content').innerHTML = html;
}

// 搜索
async function doSearch() {
  const kw = $one('#searchInput').value.trim();
  currentDate = $one('#dateSelect').value || currentDate;
  if (!kw) { loadDashboard(); return; }
  $one('#pageTitle').textContent = '搜索: ' + kw;
  const list = await api('/api/search?keyword='+encodeURIComponent(kw)+'&date='+currentDate);
  if (!list.length) { $one('#content').innerHTML='<div class="empty">未找到匹配接口</div>'; return; }
  let rows = list.map(r => {
    let badge = r.success_rate<90?'err':r.success_rate<99?'warn':'ok';
    return '<tr><td>'+r.project+'</td><td>'+r.class+'</td>' +
      '<td><a href="#" onclick="event.preventDefault();selectMethod(\''+r.project+'\',\''+r.class+'\',\''+r.method+'\')">'+r.method+'</a></td>' +
      '<td>'+r.uri+'</td><td>'+r.count+'</td><td><span class="badge '+badge+'">'+r.success_rate+'%</span></td><td>'+r.avg_time+'ms</td></tr>';
  }).join('');
  $one('#content').innerHTML = '<div class="panel"><h3>搜索结果</h3>' +
    '<table><thead><tr><th>项目</th><th>类</th><th>方法</th><th>URI</th><th>次数</th><th>成功率</th><th>平均耗时</th></tr></thead>' +
    '<tbody>'+rows+'</tbody></table></div>';
}

$one('#searchInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

// 自动刷新
setInterval(() => {
  loadTree();
  if (!currentMethod) loadDashboard();
}, 10000);

// 初始加载
initDates().then(() => {
  loadTree();
  loadDashboard();
});
</script>
</body>
</html>
