# API 性能监控系统配置文件
# 包含客户端（monitor）和服务端（server）两部分配置

# ============================================================
# 客户端配置 - 控制数据采集和发送行为
# ============================================================
monitor:
  # 是否启用监控采集
  enabled: true

  # 监控服务端 UDP 地址
  udp_host: "127.0.0.1"

  # 监控服务端 UDP 端口
  udp_port: 9501

  # 项目名称（用于区分不同项目的监控数据）
  project: "demo-project"

  # 采样率 0.0~1.0（1.0 = 100% 采集，0.5 = 50% 采集）
  sample_rate: 1.0

  # 缓冲区大小（累积多少条记录后批量发送，减少 UDP 包数量）
  buffer_size: 10

  # 排除的路径列表（匹配的请求不进行数据采集）
  exclude:
    - "/health"
    - "/favicon.ico"

# ============================================================
# 服务端配置 - 控制数据接收、存储和展示行为
# ============================================================
server:
  # HTTP 服务端口（Web 仪表盘和 API 接口）
  http_port: 8095

  # UDP 监听端口（接收客户端发送的监控数据）
  udp_port: 9501

  # 存储驱动（目前仅支持 memory，无外部依赖）
  storage_driver: "memory"

  # 仪表盘访问密码（为空则不需要密码）
  password: "888888"

  # 日志持久化配置
  log:
    # 是否启用日志持久化（定时将内存数据导出为 JSON 文件）
    enable: true

    # 导出间隔（秒），默认每 60 秒导出一次
    interval: 60
